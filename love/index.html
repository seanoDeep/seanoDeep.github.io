    this._bindEvents();
    this._buildAct2();
    this._buildAct4();
    this._updateAudioIcon();

    // 加载存储
    this._loadStorage();
  }

  // ---- 本地存储 ----
  _saveStorage() {
    Storage.set({
      response: this.currentAct === 5 ? 'visited' : (this.confessionAllShown ? 'revealed' : 'exploring'),
      lastAct: this.currentAct,
      visitTime: new Date().toISOString(),
    });
  }

  _loadStorage() {
    const data = Storage.get();
    // 仅用于恢复部分状态，不自动跳转
  }

  // ---- 音频图标 ----
  _updateAudioIcon() {
    this.els.audioToggle.textContent = this.audio.muted ? '🔇' : '🔊';
  }

  // ---- 事件绑定 ----
  _bindEvents() {
    // 音频开关
    this.els.audioToggle.addEventListener('click', () => {
      this.audio.toggle();
      this._updateAudioIcon();
      if (!this.audio.muted && CONFIG.audio.bgm) {
        this.audio.playBGM(CONFIG.audio.bgm);
      }
    });

    // Act 1: 长按主星
    this._bindLongPress();

    // Act 2: 星球点击（委托）
    this.els.act2Trail.addEventListener('click', (e) => {
      const planet = e.target.closest('.act2-planet');
      if (!planet) return;
      const index = parseInt(planet.dataset.index);
      this._onPlanetClick(index, planet);
    });

    // Act 3: 心跳点击
    this.els.act3Heart.addEventListener('click', () => this._onHeartTap());

    // Act 4: 向上滑动
    this._bindSwipeUp();

    // Act 4 按钮
    $('#btnAgree').addEventListener('click', () => this._onAgree());
    $('#btnThink').addEventListener('click', () => this._onThink());

    // Think overlay
    $('#btnReplay').addEventListener('click', () => this._replay());
    $('#btnWriteMsg').addEventListener('click', () => this._showMsgInput());

    // Message overlay
    this.els.msgTextarea.addEventListener('input', () => {
      const len = this.els.msgTextarea.value.length;
      this.els.msgCount.textContent = len;
    });
    $('#btnMsgSubmit').addEventListener('click', () => this._onMsgSubmit());

    // Feedback
    $('#btnBackHome').addEventListener('click', () => this._replay());

    // Memory close
    $('#memoryClose').addEventListener('click', () => this._closeMemory());
    // 点击遮罩关闭
    this.els.memoryOverlay.querySelector('.overlay-bg').addEventListener('click', () => this._closeMemory());
    this.els.quizOverlay.querySelector('.overlay-bg').addEventListener('click', () => {
      this.els.quizOverlay.classList.remove('show');
    });
    this.els.thinkOverlay.querySelector('.act5-think-card').addEventListener('click', (e) => e.stopPropagation());
    // Think overlay background click
    this.els.thinkOverlay.addEventListener('click', (e) => {
      if (e.target === this.els.thinkOverlay) this.els.thinkOverlay.classList.remove('show');
    });
    // Message overlay background click
    this.els.msgOverlay.addEventListener('click', (e) => {
      if (e.target === this.els.msgOverlay) this.els.msgOverlay.classList.remove('show');
    });

    // 全局触摸轨迹
    document.addEventListener('touchmove', (e) => this._touchTrail(e), { passive: true });
    document.addEventListener('mousemove', (e) => this._touchTrail(e), { passive: true });

    // Act 2 滚动视差：星轨光柱随滚动微移
    this.els.act2Container.addEventListener('scroll', () => {
      if (this.currentAct !== 2) return;
      const scrollY = this.els.act2Container.scrollTop;
      this.els.act2TrailGlow.style.transform = `translateX(-50%) translateY(${scrollY * 0.03}px)`;
    }, { passive: true });

    // 页面可见性变化（从短信应用返回）
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && this._pendingSMS) {
        this._pendingSMS = false;
        // 用户已返回，反馈已显示
      }
    });
  }

  // ---- 全局触摸轨迹 ----
  _touchTrail(e) {
    if (Math.random() > 0.3) return;
    const x = e.touches ? e.touches[0].clientX : e.clientX;
    const y = e.touches ? e.touches[0].clientY : e.clientY;
    this.fx.emit(x, y, 1, {
      radius: 2,
      life: 0.6,
      speed: 0.2,
      spread: 0.5,
      gravity: 0,
      color: 'hsl(270,40%,80%)',
    });
  }

  // ---- Act 1: 长按交互 ----
  _bindLongPress() {
    const star = this.els.act1Star;
    const progress = this.els.act1Progress;
    const ring = this.els.act1ProgressRing;
    const LONG_PRESS_DURATION = 1800; // ms

    const startPress = (e) => {
      if (this.transitioning || this.currentAct !== 1) return;
      e.preventDefault();
      this.isLongPressing = true;
      this.longPressProgress = 0;
      star.classList.add('pressing');
      progress.classList.add('show');
      ring.classList.add('show');
      this.audio.resume();

      const startTime = Date.now();
      const updateProgress = () => {
        if (!this.isLongPressing) return;
        const elapsed = Date.now() - startTime;
        this.longPressProgress = Math.min(1, elapsed / LONG_PRESS_DURATION);

        // 生成星轨粒子
        if (elapsed > 300 && Math.random() > 0.4) {
          const rect = star.getBoundingClientRect();
          const cx = rect.left + rect.width / 2;
          const cy = rect.top + rect.height / 2;
          this.fx.orbitParticles(cx, cy, 2);
        }

        if (elapsed >= LONG_PRESS_DURATION) {
          this._onLongPressComplete();
        } else {
          this.longPressTimer = requestAnimationFrame(updateProgress);
        }
      };
      this.longPressTimer = requestAnimationFrame(updateProgress);
    };

    const endPress = (e) => {
      if (!this.isLongPressing) return;
      this.isLongPressing = false;
      cancelAnimationFrame(this.longPressTimer);
      star.classList.remove('pressing');
      progress.classList.remove('show');
      ring.classList.remove('show');
      this.longPressProgress = 0;
    };

    star.addEventListener('touchstart', startPress, { passive: false });
    star.addEventListener('touchend', endPress);
    star.addEventListener('touchcancel', endPress);
    star.addEventListener('mousedown', startPress);
    star.addEventListener('mouseup', endPress);
    star.addEventListener('mouseleave', endPress);
  }

  _onLongPressComplete() {
    this.isLongPressing = false;
    this.transitioning = true;
    cancelAnimationFrame(this.longPressTimer);
    this.els.act1Progress.classList.remove('show');
    this.els.act1ProgressRing.classList.remove('show');
    this.els.act1Star.classList.remove('pressing');

    // 播放 BGM
    if (!this.audio.muted) {
      if (CONFIG.audio.bgm) this.audio.playBGM(CONFIG.audio.bgm);
    }

    // 镜头推进效果
    this.els.cameraZoom.classList.add('active');
    this.audio.playCrystal();

    setTimeout(() => {
      this.els.cameraZoom.classList.remove('active');
      this._goToAct(2);
      this.transitioning = false;
    }, 1000);
  }

  // ---- Act 切换 ----
  _goToAct(actNum) {
    // 退出当前
    const currentEl = $(`.act.active`);
    if (currentEl) {
      currentEl.classList.add('exit-forward');
      currentEl.classList.remove('active');
      setTimeout(() => currentEl.classList.remove('exit-forward'), 800);
    }

    // 进入新 Act
    const targetMap = { 1: this.els.act1, 2: this.els.act2, 3: this.els.act3, 4: this.els.act4, 5: this.els.act5 };
    const target = targetMap[actNum];
    if (target) {
      setTimeout(() => {
        target.classList.add('active');
      }, 400);
    }
    this.currentAct = actNum;
    this._saveStorage();

    // 离开 Act 2 时清理轨道粒子定时器
    if (actNum !== 2 && this._orbitalInterval) {
      clearInterval(this._orbitalInterval);
      this._orbitalInterval = null;
    }

    // 离开 Act 3 时清理定时器
    if (this._codeRainTimer) {
      clearTimeout(this._codeRainTimer);
      this._codeRainTimer = null;
    }
    this._stopHeartDecay();

    // 离开 Act 4 时关闭代码雨
    if (actNum !== 4 && this.codeRain) {
      this.codeRain.hide();
    }

    // Act 特定初始化
    if (actNum === 3) this._initAct3();
    if (actNum === 4) this._initAct4();
  }

  // ---- Act 2: 构建星轨 + 星座进度条 ----
  _buildAct2() {
    const trail = this.els.act2Trail;
    // 清除旧星球
    this.planetElements.forEach(el => el.remove());
    this.planetElements = [];
    this.planetStates = []; // 每颗星球的状态：'locked' | 'awakening' | 'unlocked' | 'completed'

    // 重置滚动位置
    this.els.act2Container.scrollTop = 0;

    CONFIG.planets.forEach((planet, i) => {
      const div = document.createElement('div');
      div.className = `act2-planet ${planet.side}`;
      div.dataset.index = i;
      // 使用 theme 类名
      const theme = planet.theme || 'crystal';
      div.innerHTML = `
        <div class="act2-planet-dot theme-${theme}"></div>
        <div class="act2-planet-connector"></div>
        <span class="act2-planet-label">${planet.label}</span>
        <div class="act2-planet-unlock-fx"></div>
      `;
      trail.appendChild(div);
      this.planetElements.push(div);
      this.planetStates.push('locked');
    });

    // 初始解锁第一颗 + 第二颗进入 awakening 状态
    if (this.planetElements.length > 0) {
      this.planetElements[0].classList.add('unlocked');
      this.planetStates[0] = 'unlocked';
      this.unlockedPlanets = 1;
      this._updateTrailGlow();
    }
    if (this.planetElements.length > 1) {
      this.planetElements[1].classList.add('state-awakening');
      this.planetStates[1] = 'awakening';
    }

    // 启动轨道粒子定时器
    this._startOrbitalParticles();
  }

  // 启动轨道粒子系统（仅对已解锁的星球）
  _startOrbitalParticles() {
    if (this._orbitalInterval) clearInterval(this._orbitalInterval);
    this._orbitalInterval = setInterval(() => {
      if (this.currentAct !== 2) return;
      this.planetElements.forEach((el, i) => {
        if (this.planetStates[i] !== 'unlocked' && this.planetStates[i] !== 'completed') return;
        const dot = el.querySelector('.act2-planet-dot');
        if (!dot) return;
        const rect = dot.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        const theme = CONFIG.planets[i].theme || 'crystal';
        // 每 200ms 生成 2 个轨道粒子
        if (Math.random() < 0.5) {
          this.fx.planetOrbit(cx, cy, theme, 2);
        }
      });
    }, 200);
  }

  _updateTrailGlow() {
    const total = CONFIG.planets.length;
    const pct = (this.unlockedPlanets / total) * 100;
    this.els.act2TrailGlow.style.height = pct + '%';
  }

  _onPlanetClick(index, element) {
    if (this.transitioning) return;

    // 必须按顺序解锁
    if (index > this.unlockedPlanets) return;

    // 如果已经解锁，可以重新查看
    if (index < this.unlockedPlanets) {
      this._showPlanetContent(index);
      return;
    }

    // 解锁当前
    this.unlockedPlanets = index + 1;
    this.planetStates[index] = 'unlocked';
    element.classList.add('unlocked');
    element.classList.remove('state-awakening');
    this._updateTrailGlow();
    this.audio.playCrystal();

    // 解锁爆发特效
    this._triggerUnlockBurst(element);

    // 下一颗进入 awakening
    if (index + 1 < this.planetElements.length && this.planetStates[index + 1] === 'locked') {
      this.planetElements[index + 1].classList.add('state-awakening');
      this.planetStates[index + 1] = 'awakening';
    }

    // 滚动到当前星球
    element.scrollIntoView({ behavior: 'smooth', block: 'center' });

    // 显示内容
    setTimeout(() => {
      this._showPlanetContent(index);
      // 标记为 completed
      this.planetStates[index] = 'completed';
      element.classList.add('state-completed');
    }, 500);

    // 检查是否全部解锁
    if (this.unlockedPlanets >= CONFIG.planets.length) {
      setTimeout(() => this._onAllPlanetsUnlocked(), 1500);
    }
  }

  // 解锁爆发环特效
  _triggerUnlockBurst(element) {
    const fx = element.querySelector('.act2-planet-unlock-fx');
    if (!fx) return;
    fx.classList.remove('burst');
    void fx.offsetWidth; // reflow
    fx.classList.add('burst');

    // 同时在 FX Canvas 上生成粒子
    const dot = element.querySelector('.act2-planet-dot');
    if (dot) {
      const rect = dot.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const theme = CONFIG.planets[parseInt(element.dataset.index)].theme || 'crystal';
      const themeHues = {
        crystal: [250, 270, 290], nebula: [320, 340, 300],
        lava: [30, 40, 20], ice: [200, 210, 190],
        stardust: [290, 310, 280], ringed: [35, 45, 25],
      };
      const hues = themeHues[theme] || [250, 270];
      for (let i = 0; i < 20; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 2 + Math.random() * 3;
        const hue = hues[Math.floor(Math.random() * hues.length)];
        this.fx.particles.push({
          x: cx, y: cy,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 0.5 + Math.random() * 0.5,
          maxLife: 1,
          r: 1.5 + Math.random() * 2,
          color: `hsl(${hue},70%,80%)`,
          gravity: 0,
          fade: true,
          shrink: true,
        });
      }
    }
  }

  _showPlanetContent(index) {
    const planet = CONFIG.planets[index];
    if (planet.type === 'memory') {
      this.els.memoryImg.src = planet.image;
      this.els.memoryImg.alt = planet.label;
      // 图片加载失败处理
      this.els.memoryImg.onerror = () => {
        this.els.memoryImg.style.display = 'none';
      };
      this.els.memoryImg.onload = () => {
        this.els.memoryImg.style.display = '';
      };
      this.els.memoryText.textContent = planet.text;
      this.els.memoryOverlay.classList.add('show');
    } else if (planet.type === 'quiz') {
      this._showQuiz(index);
    }
  }

  _closeMemory() {
    this.els.memoryOverlay.classList.remove('show');
  }

  _showQuiz(index) {
    const planet = CONFIG.planets[index];
    this.els.quizQuestion.textContent = planet.question;
    this.els.quizOptions.innerHTML = '';
    this.els.quizHint.classList.remove('show');
    this.els.quizOverlay._quizIndex = index;

    planet.options.forEach((opt, i) => {
      const btn = document.createElement('button');
      btn.className = 'quiz-option';
      btn.textContent = opt;
      btn.addEventListener('click', () => this._onQuizAnswer(index, i, btn));
      this.els.quizOptions.appendChild(btn);
    });

    this.els.quizOverlay.classList.add('show');
  }

  _onQuizAnswer(index, selected, btn) {
    const planet = CONFIG.planets[index];
    const allOptions = $$('.quiz-option', this.els.quizOptions);

    if (selected === planet.correct) {
      // 正确
      btn.classList.add('correct');
      this.els.quizHint.classList.remove('show');
      this.audio.playCrystal();
      setTimeout(() => {
        this.els.quizOverlay.classList.remove('show');
        allOptions.forEach(o => o.classList.remove('correct', 'wrong'));
      }, 800);
    } else {
      // 错误
      btn.classList.add('wrong');
      this.els.quizHint.classList.add('show');
      setTimeout(() => btn.classList.remove('wrong'), 500);
    }
  }

  _onAllPlanetsUnlocked() {
    this.transitioning = true;
    this.els.act2FinalText.classList.add('show');
    this.audio.playCrystal();

    setTimeout(() => {
      this.els.act2FinalText.classList.remove('show');
      this._goToAct(3);
      this.transitioning = false;
    }, 2500);
  }

  // ---- Act 3: 心跳谜题 ----
  _initAct3() {
    this.heartTaps = 0;
    this.heartMatchPercent = 0;
    this.heartRevealed = false;
    this.keywordsActive = false;
    this.els.act3Match.textContent = '0%';
    this.els.act3TapHint.style.display = '';
    this.els.act3Result.classList.remove('show');
    this.els.act3ResultName.textContent = CONFIG.names.sender;
    this.els.act3Keywords.classList.remove('show');
    this.els.act3Keywords.innerHTML = '';
    this.els.act3Heart.style.opacity = '';
    this.els.act3Heart.style.transition = '';
    this.els.act3Heart.style.display = '';
    this._stopHeartDecay();
    // 关闭代码雨
    if (this.codeRain) this.codeRain.hide();
  }

  _onHeartTap() {
    if (this.heartRevealed) return;

    this.heartTaps++;
    this.audio.playHeartbeat();

    // 连续点击递增：每次 +10~15，平滑递增
    let increment = 10 + Math.floor(Math.random() * 6);
    // 越接近100%增量越小，防止溢出
    if (this.heartMatchPercent > 80) increment = 5 + Math.floor(Math.random() * 4);
    if (this.heartMatchPercent > 95) increment = 3 + Math.floor(Math.random() * 3);

    this.heartMatchPercent = Math.min(100, this.heartMatchPercent + increment);
    this.els.act3Match.textContent = this.heartMatchPercent + '%';

    // 心跳动画缩放
    this.els.act3Heart.style.transform = 'scale(0.9)';
    setTimeout(() => { this.els.act3Heart.style.transform = ''; }, 100);

    // 重置衰减定时器，重新开始衰减
    this._restartHeartDecay();

    // 达到100%后触发炸裂效果
    if (this.heartMatchPercent >= 100) {
      this._revealHeartResult();
    }
  }

  // 停止点击后平滑递减
  _startHeartDecay() {
    this._stopHeartDecay();
    this.heartDecayTimer = setInterval(() => {
      if (this.heartRevealed || this.heartMatchPercent <= 0) {
        this._stopHeartDecay();
        return;
      }
      // 平滑递减，每次 -1~2%
      let decay = 1 + Math.random();
      this.heartMatchPercent = Math.max(0, +(this.heartMatchPercent - decay).toFixed(1));
      this.els.act3Match.textContent = Math.round(this.heartMatchPercent) + '%';
    }, 200);
  }

  _stopHeartDecay() {
    if (this.heartDecayTimer) {
      clearInterval(this.heartDecayTimer);
      this.heartDecayTimer = null;
    }
  }

  _restartHeartDecay() {
    this._stopHeartDecay();
    // 延迟300ms后开始衰减，模拟"短暂的停顿后开始下降"
    this.heartDecayTimer = setTimeout(() => {
      this._startHeartDecay();
    }, 300);
  }

  _revealHeartResult() {
    this.heartRevealed = true;
    this._stopHeartDecay();
    this.els.act3TapHint.style.display = 'none';
    this.els.act3Match.textContent = '100%';

    // 心脏炸裂粒子
    const heartRect = this.els.act3Heart.getBoundingClientRect();
    const cx = heartRect.left + heartRect.width / 2;
    const cy = heartRect.top + heartRect.height / 2;
    this.fx.heartExplosion(cx, cy);
    this.audio.playFirework();

    // 隐藏心脏
    setTimeout(() => {
      this.els.act3Heart.style.opacity = '0';
      this.els.act3Heart.style.transition = 'opacity 0.5s';
    }, 300);

    // 显示词云热词
    setTimeout(() => {
      this.els.act3Heart.style.display = 'none';
      this._showLoveWordCloud();
    }, 1000);
  }

  // 词云方式展示热词（散落布局，非横排）
  _showLoveWordCloud() {
    const words = ['真爱', '永恒', '陪伴', '心动', '誓言', '缘分', '守护', '浪漫', '幸运','真爱', '永恒', '陪伴', '心动', '誓言', '缘分', '守护', '浪漫', '幸运','真爱', '永恒', '陪伴', '心动', '誓言', '缘分', '守护', '浪漫', '幸运','真爱', 
    '永恒', '陪伴', '心动', '誓言', '缘分', '守护', '浪漫', '幸运','永恒', '陪伴', '心动', '誓言', '缘分', '守护', '浪漫', '幸运','真爱', '永恒', '陪伴', '心动', '誓言', '缘分', '守护', '浪漫', '幸运','真爱', '真爱', '永恒', '陪伴', '心动', '誓言', '缘分', '守护', '浪漫', '幸运'];
    const container = this.els.act3Keywords;
    container.innerHTML = '';

    // 计算词云散落位置（在容器内随机分布，避免重叠）
    const positions = this._generateWordCloudPositions(words.length);

    words.forEach((word, i) => {
      const el = document.createElement('span');
      el.className = 'act3-keyword';
      el.textContent = word;
      el.dataset.word = word;

      // 词云散落布局：随机位置、随机旋转、随机大小
      const pos = positions[i];
      const size = 0.9 + Math.random() * 0.6; // 0.9 ~ 1.5
      const rotate = (Math.random() - 0.5) * 30; // -15° ~ 15°

      el.style.left = pos.x + '%';
      el.style.top = pos.y + '%';
      el.style.fontSize = (size * 1.3) + 'rem';
      el.style.transform = `rotate(${rotate}deg)`;
      el.style.animationDelay = (i * 0.15) + 's';

      el.addEventListener('click', (e) => this._onKeywordClick(e, el));
      container.appendChild(el);
    });

    container.classList.add('show');
    this.keywordsActive = true;
  }

  // 生成词云散落位置（避免重叠，均匀分布）
  _generateWordCloudPositions(count) {
    const positions = [];
    const minDist = 18; // 最小间距百分比

    for (let i = 0; i < count; i++) {
      let attempts = 0;
      let x, y, valid;

      do {
        // 按区域划分：将容器分为上下两个区域，热词均匀分布
        const region = Math.floor(i / (count / 2));
        if (region === 0) {
          // 上半区偏上
          x = 10 + Math.random() * 75;
          y = 5 + Math.random() * 40;
        } else {
          // 下半区偏下
          x = 10 + Math.random() * 75;
          y = 50 + Math.random() * 40;
        }

        valid = true;
        for (const p of positions) {
          const dx = x - p.x;
          const dy = y - p.y;
          if (Math.sqrt(dx * dx + dy * dy) < minDist) {
            valid = false;
            break;
          }
        }
        attempts++;
      } while (!valid && attempts < 30);

      positions.push({ x, y });
    }
    return positions;
  }

  // 热词点击：单次点击即触发跳转
  _onKeywordClick(e, el) {
    if (!this.keywordsActive) return;
    this.keywordsActive = false; // 防止连点

    const rect = el.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;

    // 1. 粒子爆发效果（使用DOM粒子，更可控）
    this._keywordBurstParticles(cx, cy);

    // 2. 音频反馈
    this.audio.playStardust();

    // 3. 热词转换为星星，飞向屏幕深处
    el.classList.add('flying');
    const flyX = (Math.random() - 0.5) * 200;
    const flyY = -(400 + Math.random() * 200);
    el.style.setProperty('--fly-x', flyX + 'px');
    el.style.setProperty('--fly-y', flyY + 'px');

    // 4. 隐藏其他热词
    const allKeywords = this.els.act3Keywords.querySelectorAll('.act3-keyword');
    allKeywords.forEach(kw => {
      if (kw !== el) {
        kw.style.transition = 'opacity 0.4s, transform 0.4s';
        kw.style.opacity = '0';
        kw.style.transform = 'scale(0.3)';
      }
    });

    // 5. 单次点击即触发跳转（不等所有热词）
    setTimeout(() => {
      this.els.act3Keywords.classList.remove('show');
      // 启动代码雨
      if (!this.codeRain) {
        this.codeRain = new CodeRain($('#codeRainCanvas'));
      }
      this.codeRain.show();
      // 短暂等待后跳转到 Act 4
      setTimeout(() => {
        this._goToAct(4);
      }, 800);
    }, 800);
  }

  // 热词点击粒子爆发（DOM粒子）
  _keywordBurstParticles(cx, cy) {
    const colors = ['#ffb0c8', '#e8c97a', '#f0c8d8', '#c4b8e8', '#a0c8f0', '#ffd700', '#ff6b9d', '#7bed9f'];
    for (let i = 0; i < 30; i++) {
      const p = document.createElement('div');
      p.className = 'keyword-burst-particle';
      const angle = Math.random() * Math.PI * 2;
      const dist = 60 + Math.random() * 120;
      const bx = Math.cos(angle) * dist;
      const by = Math.sin(angle) * dist;
      p.style.left = cx + 'px';
      p.style.top = cy + 'px';
      p.style.width = (3 + Math.random() * 5) + 'px';
      p.style.height = p.style.width;
      p.style.background = colors[Math.floor(Math.random() * colors.length)];
      p.style.boxShadow = `0 0 6px ${p.style.background}`;
      p.style.setProperty('--bx', bx + 'px');
      p.style.setProperty('--by', by + 'px');
      p.style.animationDuration = (0.6 + Math.random() * 0.4) + 's';
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 1200);
    }
  }

  // ---- Act 4: 告白揭晓 ----
  _buildAct4() {
    const container = this.els.act4Confession;
    container.innerHTML = '';
    CONFIG.confession.forEach((line, i) => {
      const div = document.createElement('div');
      div.className = 'act4-line';
      if (i === CONFIG.confession.length - 1) div.classList.add('highlight');
      div.textContent = line;
      div.dataset.index = i;
      container.appendChild(div);
    });
  }

  _initAct4() {
    this.confessionRevealed = 0;
    this.confessionAllShown = false;
    this.els.act4Buttons.classList.remove('show');
    this.els.act4SwipeHint.style.display = '';
    $$('.act4-line').forEach(el => el.classList.remove('visible'));
    this.els.act4Container.scrollTop = 0;
    this.els.act4FadeTop.classList.remove('show');
    this.els.act4FadeBottom.classList.remove('show');
    // 显示代码雨到 Act 4（如未初始化则创建）
    if (!this.codeRain) {
      this.codeRain = new CodeRain($('#codeRainCanvas'));
    }
    this.codeRain.show();
  }

  _bindSwipeUp() {
    const container = this.els.act4Container;
    let startY = 0;
    let startScroll = 0;
    let revealed = 0;

    container.addEventListener('touchstart', (e) => {
      if (this.currentAct !== 4) return;
      startY = e.touches[0].clientY;
      startScroll = container.scrollTop;
    }, { passive: true });

    container.addEventListener('scroll', () => {
      if (this.currentAct !== 4 || this.confessionAllShown) return;
      this._revealConfessionLines();
    });

    // 也支持 wheel 事件（桌面调试）
    container.addEventListener('wheel', () => {
      if (this.currentAct !== 4 || this.confessionAllShown) return;
      setTimeout(() => this._revealConfessionLines(), 100);
    });
  }

  _revealConfessionLines() {
    const lines = $$('.act4-line');
    const container = this.els.act4Container;
    const containerTop = container.getBoundingClientRect().top;
    const threshold = window.innerHeight * 0.7;

    let newRevealed = 0;
    lines.forEach((line, i) => {
      const rect = line.getBoundingClientRect();
      if (rect.top < threshold && !line.classList.contains('visible')) {
        line.classList.add('visible');
        if (i > this.confessionRevealed - 1) {
          newRevealed = Math.max(newRevealed, i + 1);
        }
      }
    });

    if (newRevealed > this.confessionRevealed) {
      this.confessionRevealed = newRevealed;
    }

    // 渐变遮罩控制：有文字显示时显示渐变遮罩
    const hasVisible = lines.some(l => l.classList.contains('visible'));
    if (hasVisible) {
      this.els.act4FadeTop.classList.add('show');
      this.els.act4FadeBottom.classList.add('show');
    }

    // 检查是否全部显示
    const allVisible = lines.every(l => l.classList.contains('visible'));
    if (allVisible && !this.confessionAllShown) {
      this.confessionAllShown = true;
      this.els.act4SwipeHint.style.display = 'none';
      setTimeout(() => {
        this.els.act4Buttons.classList.add('show');
      }, 500);
    }
  }

  // ---- Act 5: 回应 ----
  _onAgree() {
    this._goToAct(5);
    this._pendingSMS = true;

    // 烟花特效
    this._launchFireworks();
    this.audio.playFirework();

    // 播放告白语音
    if (CONFIG.audio.voice) {
      this.audio.playVoice(CONFIG.audio.voice);
    }

    // 显示纪念卡
    setTimeout(() => {
      this.els.act5Card.style.display = '';
      this.els.act5CardNames.textContent = `${CONFIG.names.sender} ❤ ${CONFIG.names.receiver}`;
      const now = new Date();
      this.els.act5CardDate.textContent = `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日`;
      this._saveStorage();
    }, 1500);

    // 唤起短信
    setTimeout(() => {
      openSMS(CONFIG.sms.phoneNumber, CONFIG.sms.agreeMessage);
      this.audio.playStardust();
    }, 2500);

    // 保存回应
    Storage.set({
      response: 'yes',
      responseTime: new Date().toISOString(),
    });
  }

  _launchFireworks() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    const bursts = [
      { x: w * 0.3, y: h * 0.3, delay: 0 },
      { x: w * 0.7, y: h * 0.25, delay: 400 },
      { x: w * 0.5, y: h * 0.4, delay: 800 },
      { x: w * 0.2, y: h * 0.5, delay: 600 },
      { x: w * 0.8, y: h * 0.35, delay: 1000 },
      { x: w * 0.4, y: h * 0.2, delay: 1200 },
      { x: w * 0.6, y: h * 0.45, delay: 1400 },
      { x: w * 0.5, y: h * 0.3, delay: 1800 },
    ];

    bursts.forEach(b => {
      setTimeout(() => {
        this.fx.fireworkBurst(b.x, b.y, 50 + Math.floor(Math.random() * 30));
        this.audio.playFirework();
      }, b.delay);
    });
  }

  _onThink() {
    this.els.thinkOverlay.classList.add('show');
    Storage.set({
      response: 'maybe',
      responseTime: new Date().toISOString(),
    });
  }

  _replay() {
    this.els.thinkOverlay.classList.remove('show');
    this.els.feedbackOverlay.classList.remove('show');
    this.els.act5Card.style.display = 'none';
    this.fx.clear();

    // 重置所有状态
    this.unlockedPlanets = 0;
    this.heartTaps = 0;
    this.heartMatchPercent = 0;
    this.heartRevealed = false;
    this.keywordsActive = false;
    this.confessionRevealed = 0;
    this.confessionAllShown = false;
    this.transitioning = false;
    this._pendingSMS = false;
    this._stopHeartDecay();

    // 重置 Act 2
    this.planetElements.forEach(el => el.classList.remove('unlocked'));
    this._buildAct2();

    // 重置 Act 3
    this.els.act3Match.textContent = '0%';
    this.els.act3TapHint.style.display = '';
    this.els.act3Result.classList.remove('show');
    this.els.act3Heart.style.opacity = '';
    this.els.act3Heart.style.transition = '';
    this.els.act3Keywords.classList.remove('show');
    this.els.act3Keywords.innerHTML = '';

    // 重置 Act 4
    this._initAct4();
    this.els.act4Buttons.classList.remove('show');

    // 关闭代码雨
    if (this.codeRain) this.codeRain.hide();

    // 回到 Act 1
    this._goToAct(1);
  }

  _showMsgInput() {
    this.els.thinkOverlay.classList.remove('show');
    this.els.msgTextarea.value = '';
    this.els.msgCount.textContent = '0';
    this.els.msgOverlay.classList.add('show');
    setTimeout(() => this.els.msgTextarea.focus(), 400);
  }

  _onMsgSubmit() {
    const text = this.els.msgTextarea.value.trim();
    if (!text) {
      showToast('写点什么再送出呀～');
      return;
    }

    this.els.msgOverlay.classList.remove('show');
    this.audio.playStardust();

    // 保存到本地存储
    Storage.set({
      customMessage: text,
      customMessageTime: new Date().toISOString(),
      response: 'custom',
    });

    this._pendingSMS = true;
    // 唤起短信
    const sent = openSMS(CONFIG.sms.phoneNumber, text);

    // 显示反馈
    setTimeout(() => {
      this.els.feedbackOverlay.classList.add('show');
    }, sent ? 300 : 100);
  }
}
